<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SFU Calendar</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin-bottom: 8px; }
    .muted { color: #777; }
    label { display: block; margin-top: 18px; margin-bottom: 6px; font-weight: 600; }
    select, button, input { width: 100%; box-sizing: border-box; padding: 11px; font: inherit; border-radius: 8px; }
    select, input { border: 1px solid #999; background: transparent; }
    button { margin-top: 22px; border: 0; cursor: pointer; background: #1677ff; color: white; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #result { margin-top: 24px; padding: 16px; border-radius: 8px; background: #eee; color: #111; }
    #result[hidden] { display: none; }
    code { word-break: break-all; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Календарь СФУ</h1>
  <p class="muted">Выберите группу и подгруппу, чтобы получить ссылку для Apple Calendar или Google Calendar.</p>

  <label for="search">Поиск группы</label>
  <input id="search" type="search" placeholder="Например, КИ26-16/2Б">

  <label for="group">Группа</label>
  <select id="group" disabled>
    <option>Загрузка групп…</option>
  </select>

  <label for="subgroup">Подгруппа</label>
  <select id="subgroup" disabled></select>

  <button id="create" disabled>Получить ссылку на календарь</button>

  <section id="result" hidden>
    <strong>Ссылка на календарь:</strong>
    <p><a id="calendar-link" target="_blank" rel="noopener"></a></p>
    <button id="copy">Скопировать ссылку</button>
    <p class="muted">Добавьте эту ссылку как подписной календарь в приложении календаря.</p>
  </section>

  <p id="error" class="error" role="alert"></p>

  <script>
    const search = document.querySelector('#search');
    const groupSelect = document.querySelector('#group');
    const subgroupSelect = document.querySelector('#subgroup');
    const createButton = document.querySelector('#create');
    const result = document.querySelector('#result');
    const calendarLink = document.querySelector('#calendar-link');
    const copyButton = document.querySelector('#copy');
    const error = document.querySelector('#error');
    let groups = [];

    function visibleGroups() {
      const query = search.value.trim().toLowerCase();
      return groups.filter(group => group.name.toLowerCase().includes(query));
    }

    function renderGroups() {
      const current = groupSelect.value;
      groupSelect.innerHTML = '';
      for (const group of visibleGroups()) {
        const option = new Option(
          `${group.name} — ${group.institute}, ${group.course} курс`,
          group.name
        );
        groupSelect.add(option);
      }
      groupSelect.disabled = groupSelect.options.length === 0;
      if ([...groupSelect.options].some(option => option.value === current)) {
        groupSelect.value = current;
      }
      renderSubgroups();
    }

    function renderSubgroups() {
      const selected = groups.find(group => group.name === groupSelect.value);
      subgroupSelect.innerHTML = '';
      if (!selected) {
        subgroupSelect.disabled = true;
        createButton.disabled = true;
        return;
      }
      for (const subgroup of selected.subgroups) {
        subgroupSelect.add(new Option(`${subgroup} подгруппа`, subgroup));
      }
      subgroupSelect.disabled = selected.subgroups.length === 0;
      createButton.disabled = subgroupSelect.disabled;
    }

    async function loadGroups() {
      try {
        const response = await fetch('/api/groups');
        if (!response.ok) throw new Error('Не удалось загрузить список групп');
        groups = await response.json();
        renderGroups();
      } catch (exception) {
        error.textContent = exception.message;
      }
    }

    search.addEventListener('input', renderGroups);
    groupSelect.addEventListener('change', renderSubgroups);
    createButton.addEventListener('click', () => {
      const group = groups.find(item => item.name === groupSelect.value);
      const fullName = `${group.name} (${subgroupSelect.value} подгруппа)`;
      const encoded = encodeURIComponent(fullName);
      // Ссылка строится сервером через редирект не нужна: id вычисляется здесь
      // по тому же алгоритму, поэтому endpoint ниже получает готовый адрес.
      fetch(`/api/calendar-link?group=${encoded}`)
        .then(response => response.ok ? response.json() : response.json().then(data => Promise.reject(new Error(data.error))))
        .then(data => {
          calendarLink.href = data.url;
          calendarLink.textContent = data.url;
          result.hidden = false;
          error.textContent = '';
        })
        .catch(exception => error.textContent = exception.message);
    });
    copyButton.addEventListener('click', async () => {
      await navigator.clipboard.writeText(calendarLink.href);
      copyButton.textContent = 'Скопировано';
      setTimeout(() => copyButton.textContent = 'Скопировать ссылку', 1500);
    });
    loadGroups();
  </script>
</body>
</html>
